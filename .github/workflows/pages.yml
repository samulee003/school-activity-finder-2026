name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate activity data
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const required = ['id', 'title', 'category', 'grades', 'days', 'variants'];

          function validate(data, label) {
            if (!Array.isArray(data) || data.length === 0) {
              throw new Error(`${label} must contain a non-empty array`);
            }
            const ids = new Set();
            data.forEach((item, index) => {
              if (!item || required.some((key) => !(key in item))) {
                throw new Error(`${label} record ${index + 1} is missing required fields`);
              }
              if (typeof item.id !== 'string' || !item.id.trim()) {
                throw new Error(`${label} record ${index + 1} has an invalid id`);
              }
              if (ids.has(item.id)) {
                throw new Error(`${label} contains duplicate id: ${item.id}`);
              }
              ids.add(item.id);
              if (!Array.isArray(item.grades) || !item.grades.length ||
                  !item.grades.every((grade) => Number.isInteger(grade) && grade >= 1 && grade <= 6)) {
                throw new Error(`${label} record ${index + 1} has invalid grades`);
              }
              if (!Array.isArray(item.days) || !Array.isArray(item.variants)) {
                throw new Error(`${label} record ${index + 1} has invalid list fields`);
              }
            });
            return data;
          }

          const plainSource = fs.readFileSync('data-plain.js', 'utf8');
          const plainMatch = plainSource.match(/^window\.__DATA__=(.*);\s*$/s);
          if (!plainMatch) throw new Error('Plain activity data was not found');
          const plain = validate(JSON.parse(plainMatch[1]), 'data-plain.js');

          const compressedSource = fs.readFileSync('data.js', 'utf8');
          const compressedMatch = compressedSource.match(/^window\.__DATA_GZIP__='([^']+)';\s*$/s);
          if (!compressedMatch) throw new Error('Compressed activity data was not found');
          const compressed = validate(
            JSON.parse(zlib.gunzipSync(Buffer.from(compressedMatch[1], 'base64')).toString('utf8')),
            'data.js'
          );

          if (JSON.stringify(plain) !== JSON.stringify(compressed)) {
            throw new Error('Plain and compressed activity data do not match');
          }
          console.log(`Validated ${plain.length} activities`);
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
